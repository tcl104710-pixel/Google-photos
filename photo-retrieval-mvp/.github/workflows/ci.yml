name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── Python Backend ──────────────────────────────────────────────────────────
  backend-lint:
    name: Python Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: photo-retrieval-mvp
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: photo-retrieval-mvp
        run: ruff check .

      - name: Mypy type check
        working-directory: photo-retrieval-mvp
        run: mypy models/ --ignore-missing-imports

  backend-test:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: photo_retrieval_test
          POSTGRES_USER: photo_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: photo-retrieval-mvp
        run: pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: photo-retrieval-mvp
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://photo_user:test_password@localhost:5432/photo_retrieval_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_not_for_production
          GROQ_API_KEY: test_key
        run: pytest tests/unit/ -v --cov=models --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: photo-retrieval-mvp/coverage.xml

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: photo-retrieval-mvp/frontend/package-lock.json

      - name: Install dependencies
        working-directory: photo-retrieval-mvp/frontend
        run: npm ci

      - name: ESLint
        working-directory: photo-retrieval-mvp/frontend
        run: npm run lint
